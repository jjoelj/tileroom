# /etc/nginx/snippets/tileroom-proxy.conf, shared by production and staging (the server block sets $tileroom).
# The app sets Cache-Control itself (sw.js and the manifest revalidate, hashed assets are immutable).
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy same-origin always;
add_header Content-Security-Policy "frame-ancestors 'none'" always; # no clickjacking via iframes

gzip on;
gzip_types text/plain text/css application/javascript application/json application/manifest+json image/svg+xml;

location /ws {
    proxy_pass $tileroom;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 1h; # game sockets sit idle between turns
}

location / {
    proxy_pass $tileroom;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
